    <script>
      (function () {
        var KEY = 'lumina-sw-bust'
        function wipe(thenReload) {
          var go = function () {
            if (thenReload && !sessionStorage.getItem(KEY)) {
              sessionStorage.setItem(KEY, '1')
            }
          }
          var hadWorker = false
          var p = Promise.resolve()
          if (navigator.serviceWorker) {
            p = navigator.serviceWorker.getRegistrations().then(function (regs) {
              hadWorker = regs.length > 0 || !!navigator.serviceWorker.controller
              return Promise.all(regs.map(function (r) { return r.unregister() }))
            })
          }
          p.then(function () {
            return window.caches ? caches.keys() : []
          }).then(function (keys) {
            return Promise.all((keys || []).map(function (k) { return caches.delete(k) }))
          }).finally(function () {
            go()
            if (!thenReload && hadWorker && !sessionStorage.getItem(KEY)) {
              sessionStorage.setItem(KEY, '1')
            }
          })
        }
        window.addEventListener('error', function (e) {
          var msg = String((e.error && e.error.message) || e.message || '')
          if (/does not provide an export named|Failed to fetch dynamically imported module|missing AppProvider/.test(msg)) {
            wipe(true)
            var root = document.getElementById('root')
            if (root && sessionStorage.getItem(KEY)) {
              root.innerHTML = '<div style="min-height:100vh;padding:32px;background:#08070b;color:#f4efe6;font-family:system-ui,sans-serif"><p style="color:#e4c36a;letter-spacing:.16em;font-size:12px">LUMINA VOICE</p><h1 style="font-size:28px">Something went wrong</h1><pre style="white-space:pre-wrap;color:#ef6b6b;font-size:13px">' + msg.replace(/</g, '&lt;') + '</pre><button id="lumina-reset" type="button" style="margin-top:16px;height:44px;padding:0 18px;border-radius:999px;border:0;background:#e4c36a;color:#1a1408;font-weight:600">Reset and reload</button></div>'
              var btn = document.getElementById('lumina-reset')
              if (btn) btn.onclick = function () { sessionStorage.removeItem(KEY); wipe(true) }
            }
            return
          }
          if (e.error) console.error(e.error)
        })
      })()
    </script>
