services:
  lumina-voice:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-}
    image: lumina-voice:local
    container_name: lumina-voice
    ports:
      - "4310:80"
    volumes:
      # `npm run catalogue:export` updates this file without a rebuild.
      - ./public/catalogue.json:/usr/share/nginx/html/catalogue.json:ro
    restart: unless-stopped
