name: Supabase keep-alive

# Supabase pauses free projects after a stretch with no requests. Two tiny
# authenticated reads per day keep the project active. These are the public
# project URL and publishable key (safe for client-side use); repository
# secrets take precedence if you add them later under Settings → Secrets.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase auth and REST
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ueiwzhjruyijtssysekq.supabase.co' }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_p13bTDBZRcPI6TK8EoSO8w_C6jpxlWT' }}
        run: |
          set -eu
          [ -n "$SUPABASE_URL" ] || { echo "::error::SUPABASE_URL is empty"; exit 1; }
          [ -n "$SUPABASE_KEY" ] || { echo "::error::SUPABASE_KEY is empty"; exit 1; }
          for target in "/auth/v1/settings" "/rest/v1/profiles?select=id&limit=1"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              -H "apikey: $SUPABASE_KEY" \
              -H "Authorization: Bearer $SUPABASE_KEY" \
              "$SUPABASE_URL$target")
            echo "Ping $target -> HTTP $code"
            [ "$code" = "200" ] || { echo "::error::Supabase ping failed for $target"; exit 1; }
          done
          echo "Supabase project is active."
