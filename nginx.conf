server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router: every client route falls back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The dev-only folder browser is not available in a static image.
    location = /media-index {
        return 404;
    }

    # Cron-published metadata snapshot: never cache a stale catalogue.
    location = /catalogue.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|avif|ico|woff2?|mp3|m4a|opus|ogg|wav|flac)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;
}
